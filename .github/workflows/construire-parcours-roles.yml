name: Construire Parcours tous roles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/construire-parcours-roles.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bda4c61e05ec91a9db4ae44d62480178103d8e39
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - name: Construire avec chemin de test corrige et erreurs visibles
        shell: bash
        run: |
          python - <<'CORRECTION'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/construire-parcours-roles.yml')
          s=p.read_text(encoding='utf-8')
          a="          python - <<'PY'\n"
          b="\n          PY"
          assert s.count(a)==1
          code=textwrap.dedent(s.split(a,1)[1].split(b,1)[0])
          changes=[
              ("C.consolider(r,{'PARCOURS':p},o,journal=lambda *a:None)",
               "fichier,_=C.consolider(r,{'PARCOURS':p},o,journal=lambda *a:None)"),
              ("next(o.glob('PARCOURS_CONSOLIDES_*.xlsx'))", "fichier"),
              ("    assert r.returncode==0,'Echec des tests : '+' '.join(args)",
               "    print(r.stdout,end='')\n    print(r.stderr,end='',file=sys.stderr)\n    assert r.returncode==0,'Echec des tests : '+' '.join(args)")
          ]
          for old,new in changes:
              assert code.count(old)==1, 'Correction absente ou ambigue : '+old
              code=code.replace(old,new,1)
          compile(code,'construction_corrigee','exec')
          exec(compile(code,'construction_corrigee','exec'),{'__name__':'__main__'})
          CORRECTION
      - uses: actions/upload-artifact@v4
        with:
          name: Parcours-consolides-tous-roles
          path: construction_roles/Parcours_consolides_tous_roles.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Journal-construction-parcours-roles
          path: construction_roles/JOURNAL.txt
          if-no-files-found: warn
